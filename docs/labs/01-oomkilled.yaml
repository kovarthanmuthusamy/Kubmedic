apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memhog
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: memhog}
  template:
    metadata:
      labels: {app: memhog}
    spec:
      containers:
      - name: stress
        image: polinux/stress
        command: ["stress"]
        args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]   # this program allocates 150 MB
        resources:
          limits: {memory: 100Mi}
